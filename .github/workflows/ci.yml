name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm audit --audit-level=high
      - name: Typecheck the Expo app
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
      - name: Build the web app (catches bundler problems before anyone pulls)
        working-directory: app
        env:
          EXPO_OFFLINE: '1'
        run: npx expo export --platform web
